services:
  gridway:
    image: ${GRIDWAY_IMAGE:-gridway:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridway-node
    ports:
      - "4545:4545"  # P2P
      - "4546:4546"  # Metrics
      - "4547:4547"  # HTTP API
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - WASI_MODULE_PATH=/usr/local/lib/gridway/wasi-modules
    volumes:
      - ./testnet/validator-0:/gridway/validator
      - ./testnet/peers.yaml:/gridway/peers.yaml:ro
      - ./testnet/genesis.yaml:/gridway/genesis.yaml:ro
    entrypoint: ["gridway-node"]
    command:
      - "--peers=/gridway/peers.yaml"
      - "--config=/gridway/validator/config.yaml"
      - "--genesis=/gridway/genesis.yaml"
    networks:
      - gridway-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4547/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  gridway-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
