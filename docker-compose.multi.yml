x-gridway-base: &gridway-base
  image: ${GRIDWAY_IMAGE:-gridway:latest}
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    - RUST_LOG=${RUST_LOG:-info}
    - WASI_MODULE_PATH=/usr/local/lib/gridway/wasi-modules
  networks:
    - gridway-network
  restart: unless-stopped

services:
  # Node 0 — ports 4545 (P2P), 4546 (metrics), 4547 (HTTP API)
  gridway-0:
    <<: *gridway-base
    container_name: gridway-node-0
    ports:
      - "4545:4545"
      - "4546:4546"
      - "4547:4547"
    volumes:
      - ./testnet/validator-0:/gridway/validator
      - ./testnet/peers.yaml:/gridway/peers.yaml:ro
      - ./testnet/genesis.yaml:/gridway/genesis.yaml:ro
    entrypoint: ["gridway-node"]
    command:
      - "--peers=/gridway/peers.yaml"
      - "--config=/gridway/validator/config.yaml"
      - "--genesis=/gridway/genesis.yaml"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4547/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Node 1 — ports 4548 (P2P), 4549 (metrics), 4550 (HTTP API)
  gridway-1:
    <<: *gridway-base
    container_name: gridway-node-1
    ports:
      - "4548:4548"
      - "4549:4549"
      - "4550:4550"
    volumes:
      - ./testnet/validator-1:/gridway/validator
      - ./testnet/peers.yaml:/gridway/peers.yaml:ro
      - ./testnet/genesis.yaml:/gridway/genesis.yaml:ro
    entrypoint: ["gridway-node"]
    command:
      - "--peers=/gridway/peers.yaml"
      - "--config=/gridway/validator/config.yaml"
      - "--genesis=/gridway/genesis.yaml"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4550/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Node 2 — ports 4551 (P2P), 4552 (metrics), 4553 (HTTP API)
  gridway-2:
    <<: *gridway-base
    container_name: gridway-node-2
    ports:
      - "4551:4551"
      - "4552:4552"
      - "4553:4553"
    volumes:
      - ./testnet/validator-2:/gridway/validator
      - ./testnet/peers.yaml:/gridway/peers.yaml:ro
      - ./testnet/genesis.yaml:/gridway/genesis.yaml:ro
    entrypoint: ["gridway-node"]
    command:
      - "--peers=/gridway/peers.yaml"
      - "--config=/gridway/validator/config.yaml"
      - "--genesis=/gridway/genesis.yaml"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4553/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Node 3 — ports 4554 (P2P), 4555 (metrics), 4556 (HTTP API)
  gridway-3:
    <<: *gridway-base
    container_name: gridway-node-3
    ports:
      - "4554:4554"
      - "4555:4555"
      - "4556:4556"
    volumes:
      - ./testnet/validator-3:/gridway/validator
      - ./testnet/peers.yaml:/gridway/peers.yaml:ro
      - ./testnet/genesis.yaml:/gridway/genesis.yaml:ro
    entrypoint: ["gridway-node"]
    command:
      - "--peers=/gridway/peers.yaml"
      - "--config=/gridway/validator/config.yaml"
      - "--genesis=/gridway/genesis.yaml"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4556/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  gridway-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
