# Multi-node gridway testnet (4 validators)
# 
# All containers use internal ports 4545(p2p)/4546(metrics)/4547(http).
# External access via port mapping.
#
# Generate config with:
#   gridway-setup --peers 4 --bootstrappers 1 --internal-ports --no-local \
#     --host-pattern 'gridway-node-{}' --output testnet
#
# Then run: docker compose -f docker-compose.multi.yml up

x-gridway-base: &gridway-base
  image: ${GRIDWAY_IMAGE:-gridway:latest}
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    - RUST_LOG=${RUST_LOG:-info}
    - WASI_MODULE_PATH=/usr/local/lib/gridway/wasi-modules
  networks:
    gridway-network:
  restart: unless-stopped
  entrypoint: ["gridway-node"]
  command:
    - "--peers=/gridway/peers.yaml"
    - "--config=/gridway/validator/config.yaml"
    - "--genesis=/gridway/genesis.yaml"
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:4547/health"]
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 15s

services:
  gridway-node-0:
    <<: *gridway-base
    container_name: gridway-node-0
    ports:
      - "4545:4545"   # P2P
      - "4546:4546"   # Metrics
      - "4547:4547"   # HTTP API
    volumes:
      - ./testnet/validator-0:/gridway/validator:ro
      - ./testnet/peers.yaml:/gridway/peers.yaml:ro
      - ./testnet/genesis.yaml:/gridway/genesis.yaml:ro
      - gridway-data-0:/gridway/data
    networks:
      gridway-network:
        ipv4_address: 172.28.0.10

  gridway-node-1:
    <<: *gridway-base
    container_name: gridway-node-1
    ports:
      - "4548:4545"
      - "4549:4546"
      - "4550:4547"
    volumes:
      - ./testnet/validator-1:/gridway/validator:ro
      - ./testnet/peers.yaml:/gridway/peers.yaml:ro
      - ./testnet/genesis.yaml:/gridway/genesis.yaml:ro
      - gridway-data-1:/gridway/data
    networks:
      gridway-network:
        ipv4_address: 172.28.0.11

  gridway-node-2:
    <<: *gridway-base
    container_name: gridway-node-2
    ports:
      - "4551:4545"
      - "4552:4546"
      - "4553:4547"
    volumes:
      - ./testnet/validator-2:/gridway/validator:ro
      - ./testnet/peers.yaml:/gridway/peers.yaml:ro
      - ./testnet/genesis.yaml:/gridway/genesis.yaml:ro
      - gridway-data-2:/gridway/data
    networks:
      gridway-network:
        ipv4_address: 172.28.0.12

  gridway-node-3:
    <<: *gridway-base
    container_name: gridway-node-3
    ports:
      - "4554:4545"
      - "4555:4546"
      - "4556:4547"
    volumes:
      - ./testnet/validator-3:/gridway/validator:ro
      - ./testnet/peers.yaml:/gridway/peers.yaml:ro
      - ./testnet/genesis.yaml:/gridway/genesis.yaml:ro
      - gridway-data-3:/gridway/data
    networks:
      gridway-network:
        ipv4_address: 172.28.0.13

volumes:
  gridway-data-0:
  gridway-data-1:
  gridway-data-2:
  gridway-data-3:

networks:
  gridway-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
