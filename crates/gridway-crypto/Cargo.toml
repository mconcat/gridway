[package]
name = "gridway-crypto"
version = "0.1.0"
edition = "2021"
authors = ["mconcat"]
license = "AGPL-3.0"
description = "Cryptographic primitives for gridway — wraps commonware-cryptography"
repository = "https://github.com/mconcat/gridway"

[dependencies]
commonware-cryptography = { version = "0.0.65", features = ["mocks"] }
commonware-codec = "0.0.65"
sha2 = "0.10"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
rand = "0.8"
