[package]
name = "validator"
version = "0.1.0"
edition = "2021"
description = "WASI Validator component for Gridway — TX decode + ed25519 auth + message extraction"

[dependencies]
wit-bindgen = { version = "0.36", features = ["default"] }
wit-bindgen-rt = { version = "0.36" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast"] }
sha2 = { version = "0.10", default-features = false }

[lib]
name = "validator"
path = "src/lib.rs"
crate-type = ["cdylib"]

[package.metadata.component]
package = "gridway:framework"
target = { path = "../../../wit", world = "validator-world" }
