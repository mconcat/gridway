[package]
name = "gridway-types"
version = "0.1.0"
edition = "2021"
authors = ["mconcat"]
license = "AGPL-3.0"
description = "Core types for gridway — block, transaction, and consensus types using Commonware Library"
repository = "https://github.com/mconcat/gridway"

[dependencies]
gridway-math = { path = "../gridway-math" }
gridway-crypto = { path = "../gridway-crypto" }
commonware-codec = "0.0.65"
commonware-consensus = { version = "0.0.65", features = ["mocks"] }
commonware-cryptography = { version = "0.0.65", features = ["mocks"] }
bytes = "1.7"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.0"
