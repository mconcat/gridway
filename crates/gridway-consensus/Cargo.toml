[package]
name = "gridway-consensus"
version = "0.1.0"
edition = "2021"
authors = ["mconcat"]
license = "AGPL-3.0"
repository = "https://github.com/mconcat/gridway"
description = "Commonware consensus integration — implements Application trait wrapping BaseApp"

[dependencies]
gridway-baseapp = { workspace = true }
gridway-types = { workspace = true }
gridway-crypto = { workspace = true }
gridway-store = { workspace = true }

# Commonware
commonware-broadcast = { workspace = true }
commonware-codec = { workspace = true }
commonware-consensus = { workspace = true, features = ["mocks"] }
commonware-cryptography = { workspace = true, features = ["mocks"] }
commonware-p2p = { workspace = true }
commonware-resolver = { workspace = true }
commonware-runtime = { workspace = true }
commonware-storage = { workspace = true }
commonware-stream = { workspace = true }
commonware-utils = { workspace = true }
commonware-macros = { workspace = true }
commonware-parallel = { workspace = true }
commonware-math = "0.0.65"

# External
axum = { version = "0.8", features = ["json"] }
bytes = { workspace = true }
clap = "4.5"
futures = { workspace = true }
governor = "0.10"
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
gridway-client = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }

[[bin]]
name = "gridway-node"
path = "src/bin/gridway_node.rs"

[[bin]]
name = "gridway-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "gridway-keygen"
path = "src/bin/gridway_keygen.rs"

[[bin]]
name = "gridway-cli"
path = "src/bin/gridway_cli.rs"
