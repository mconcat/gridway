[package]
name = "gridway-client"
version = "0.1.0"
edition = "2021"
authors = ["mconcat"]
license = "AGPL-3.0"
description = "TX builder library and HTTP client for gridway"
repository = "https://github.com/mconcat/gridway"

[dependencies]
gridway-crypto = { path = "../gridway-crypto" }
commonware-cryptography = { version = "0.0.65", features = ["mocks"] }
commonware-codec = "0.0.65"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }

# Keystore dependencies
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3.14"

[features]
default = []
# Enable rustls-tls for HTTPS support (requires assembler toolchain)
rustls-tls = ["reqwest/rustls-tls"]
