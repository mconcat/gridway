[package]
name = "gridway-baseapp"
version = "0.1.0"
edition = "2021"
authors = ["mconcat"]
license = "AGPL-3.0"
repository = "https://github.com/mconcat/gridway"
description = "Base application framework — WASM microkernel with VFS and ComponentHost"

[dependencies]
gridway-store = { path = "../gridway-store" }
gridway-types = { path = "../gridway-types" }
gridway-crypto = { path = "../gridway-crypto" }
gridway-telemetry = { path = "../gridway-telemetry" }
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
hex = "0.4"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
toml = "0.8"
# WASM runtime dependencies
wasmtime = "34.0"
wasmtime-wasi = "34.0"
wasmparser = "0.218"
cap-std = "3.0"
tracing = "0.1"
anyhow = "1.0"
base64 = "0.22"
log = "0.4"

[dev-dependencies]
wat = "1.0"
tempfile = "3.0"
