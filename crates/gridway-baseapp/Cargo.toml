[package]
name = "gridway-baseapp"
version = "0.1.0"
edition = "2021"
authors = ["mconcat"]
license = "AGPL-3.0"
repository = "https://github.com/mconcat/gridway"
description = "Base application framework — WASM microkernel with VFS and ComponentHost"

[dependencies]
gridway-store = { workspace = true }
gridway-types = { workspace = true }
gridway-crypto = { workspace = true }
gridway-telemetry = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-codec = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
hex = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
toml = "0.8"
# WASM runtime dependencies
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wasmparser = "0.218"
cap-std = "3.0"
tracing = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
log = { workspace = true }

[dev-dependencies]
wat = "1.0"
tempfile = "3.0"
