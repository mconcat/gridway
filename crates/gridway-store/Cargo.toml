[package]
name = "gridway-store"
version = "0.1.0"
edition = "2021"
authors = ["mconcat"]
license = "AGPL-3.0"
repository = "https://github.com/mconcat/gridway"
description = "Storage layer for gridway — simple hash-based Merkle state store"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
hex = "0.4"

[dev-dependencies]
tempfile = "3.14"
