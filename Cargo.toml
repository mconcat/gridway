[workspace]
members = [
    "crates/gridway-types",
    "crates/gridway-math",
    "crates/gridway-crypto",
    "crates/gridway-errors",
    "crates/gridway-log",
    "crates/gridway-store",
    "crates/gridway-baseapp",
    "crates/gridway-consensus",
    "crates/gridway-telemetry",
    "crates/wasi-modules/ante-handler",
    "crates/wasi-modules/begin-blocker",
    "crates/wasi-modules/end-blocker",
    "crates/wasi-modules/tx-decoder",
    "crates/wasi-modules/test-minimal",
    "crates/wasi-modules/bank",
    "crates/wasi-modules/hook",
    "crates/wasi-modules/validator",
]

[workspace.package]
authors = ["mconcat"]
license = "AGPL-3.0"
edition = "2021"
repository = "https://github.com/mconcat/gridway"

[workspace.dependencies]
# Core crates
gridway-types = { path = "crates/gridway-types" }
gridway-math = { path = "crates/gridway-math" }
gridway-crypto = { path = "crates/gridway-crypto" }
gridway-errors = { path = "crates/gridway-errors" }
gridway-log = { path = "crates/gridway-log" }
gridway-store = { path = "crates/gridway-store" }
gridway-baseapp = { path = "crates/gridway-baseapp" }
gridway-consensus = { path = "crates/gridway-consensus" }
gridway-telemetry = { path = "crates/gridway-telemetry" }

# Commonware Library dependencies
commonware-broadcast = "0.0.65"
commonware-codec = "0.0.65"
commonware-consensus = { version = "0.0.65", features = ["mocks"] }
commonware-cryptography = { version = "0.0.65", features = ["mocks"] }
commonware-p2p = "0.0.65"
commonware-resolver = "0.0.65"
commonware-runtime = "0.0.65"
commonware-storage = "0.0.65"
commonware-stream = "0.0.65"
commonware-utils = "0.0.65"
commonware-macros = "0.0.65"
commonware-parallel = "0.0.65"

# External dependencies
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
bytes = "1.7"
futures = "0.3"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
log = "0.4"
anyhow = "1.0"

# Math dependencies
num-bigint = "0.4"
num-traits = "0.2"
rust_decimal = "1.35"

# CLI
clap = { version = "4.5", features = ["derive"] }

# WASM runtime
wasmtime = "25.0"

# Testing
proptest = "1.5"

# Workspace-wide profiles
[profile.wasi]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.release]
opt-level = 3
lto = true
overflow-checks = true

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[package]
name = "gridway"
version = "0.1.0"
edition = "2021"
authors = ["mconcat"]
description = "WASM microkernel blockchain built on Commonware Library"
license = "AGPL-3.0"
repository = "https://github.com/mconcat/gridway"

[dependencies]
gridway-types = { workspace = true }
gridway-math = { workspace = true }
gridway-crypto = { workspace = true }
gridway-errors = { workspace = true }
gridway-log = { workspace = true }
gridway-store = { workspace = true }
gridway-baseapp = { workspace = true }
gridway-consensus = { workspace = true }
gridway-telemetry = { workspace = true }

# Commonware
commonware-consensus = { workspace = true }
commonware-cryptography = { workspace = true }
commonware-runtime = { workspace = true }
commonware-storage = { workspace = true }
commonware-codec = { workspace = true }
commonware-p2p = { workspace = true }
commonware-broadcast = { workspace = true }

# External
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = "3.8"
rand = { workspace = true }
