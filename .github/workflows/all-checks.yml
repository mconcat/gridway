name: All Checks

on:
  workflow_dispatch:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  trigger-workflows:
    name: Trigger All Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Summary Header
        run: |
          echo "# Daily Integration Test Run - $(date -u '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow triggers all CI checks for the Gridway Commonware Simplex blockchain." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  ci-check:
    name: CI Build and Test
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  wasm-check:
    name: WASM Modules
    uses: ./.github/workflows/wasm-build.yml
    secrets: inherit

  wasm-test-check:
    name: WASM Tests
    uses: ./.github/workflows/wasm-test.yml
    secrets: inherit

  final-summary:
    name: Test Summary
    needs: [ci-check, wasm-check, wasm-test-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.ci-check.result }}" == "success" ]; then
            echo "### ✅ CI Build and Test: **Passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ CI Build and Test: **Failed**" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.wasm-check.result }}" == "success" ]; then
            echo "### ✅ WASM Modules: **Passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ WASM Modules: **Failed**" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.wasm-test-check.result }}" == "success" ]; then
            echo "### ✅ WASM Tests: **Passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ WASM Tests: **Failed**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.ci-check.result }}" == "success" ] && \
             [ "${{ needs.wasm-check.result }}" == "success" ] && \
             [ "${{ needs.wasm-test-check.result }}" == "success" ]; then
            echo "## 🎉 Overall Status: **All Checks Passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Overall Status: **Some Checks Failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the individual workflow runs for details." >> $GITHUB_STEP_SUMMARY
          fi
