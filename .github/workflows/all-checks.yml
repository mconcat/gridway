name: All Checks

on:
  workflow_dispatch:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  trigger-workflows:
    name: Trigger All Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Summary Header
        run: |
          echo "# Daily Integration Test Run - $(date -u '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow triggers all CI checks for the Gridway Commonware Simplex blockchain." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  ci-check:
    name: CI Build and Test
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  wasm-check:
    name: WASM Modules
    uses: ./.github/workflows/wasm-build.yml
    secrets: inherit

  wasm-test-check:
    name: WASM Tests
    uses: ./.github/workflows/wasm-test.yml
    secrets: inherit

  e2e-check:
    name: End-to-End Tests
    uses: ./.github/workflows/e2e-test.yml
    secrets: inherit

  final-summary:
    name: Test Summary
    needs: [ci-check, wasm-check, wasm-test-check, e2e-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          declare -A CHECKS=(
            ["CI Build and Test"]="${{ needs.ci-check.result }}"
            ["WASM Modules"]="${{ needs.wasm-check.result }}"
            ["WASM Tests"]="${{ needs.wasm-test-check.result }}"
            ["End-to-End Tests"]="${{ needs.e2e-check.result }}"
          )

          ALL_PASSED=true
          for name in "CI Build and Test" "WASM Modules" "WASM Tests" "End-to-End Tests"; do
            result="${CHECKS[$name]}"
            if [ "$result" == "success" ]; then
              echo "### ✅ ${name}: **Passed**" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ ${name}: **${result}**" >> $GITHUB_STEP_SUMMARY
              ALL_PASSED=false
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$ALL_PASSED" == "true" ]; then
            echo "## 🎉 Overall Status: **All Checks Passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Overall Status: **Some Checks Failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the individual workflow runs for details." >> $GITHUB_STEP_SUMMARY
          fi
