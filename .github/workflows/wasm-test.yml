name: WASM Tests

on:
  push:
    branches: [ main, develop, experiment/commonware-migration ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm-test:
    name: Test WASM Modules
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install wasmtime
      run: |
        curl https://wasmtime.dev/install.sh -sSf | bash
        echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-wasm-test-${{ hashFiles('**/Cargo.lock') }}

    - name: Verify WASM modules exist
      run: |
        echo "Pre-compiled WASM modules:"
        ls -lh modules/*.wasm

    - name: Compile WASM modules with wasmtime
      run: |
        echo "Testing that wasmtime can compile each module..."
        for wasm in modules/*.wasm; do
          echo "  Compiling: $wasm"
          $HOME/.wasmtime/bin/wasmtime compile "$wasm" && echo "    ✓ OK" || echo "    ✗ FAILED"
        done

    - name: Check WASM module sizes
      run: |
        echo "WASM Module Sizes:"
        ls -lh modules/*.wasm

    - name: Run WASM integration tests
      run: |
        cargo test --workspace \
          --exclude ante-handler \
          --exclude begin-blocker \
          --exclude end-blocker \
          --exclude tx-decoder \
          -- test_wasi_modules test_minimal_wasi_module test_component || \
          echo "No WASM-specific integration tests found (OK)"
