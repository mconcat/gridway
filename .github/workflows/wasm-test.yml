name: WASM Tests

on:
  push:
    branches: [ main, develop, experiment/commonware-migration ]
  pull_request:
    branches: [ main ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm-test:
    name: Test WASM Modules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install wasmtime
      run: |
        curl https://wasmtime.dev/install.sh -sSf | bash
        echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-wasm-test-${{ hashFiles('**/Cargo.lock') }}

    - name: Verify WASM modules exist
      run: |
        echo "Pre-compiled WASM modules:"
        ls -lh modules/*.wasm

    - name: Validate WASM modules with wasmtime
      run: |
        echo "Validating that wasmtime can compile each module..."
        FAILED=0
        for wasm in modules/*.wasm; do
          echo -n "  $(basename $wasm): "
          if $HOME/.wasmtime/bin/wasmtime compile "$wasm" 2>/dev/null; then
            echo "✓ OK"
          else
            echo "✗ FAILED"
            FAILED=1
          fi
        done

        if [ $FAILED -eq 1 ]; then
          echo "ERROR: Some WASM modules failed validation!"
          exit 1
        fi

    - name: Run WASM host integration tests
      run: |
        cargo test -p gridway-baseapp -- \
          test_component_host \
          test_kvstore_host \
          test_wasi_host \
          test_wasm_module

    - name: Check WASM module sizes
      run: |
        echo "WASM Module Sizes:"
        ls -lh modules/*.wasm
