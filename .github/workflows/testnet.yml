name: Testnet Deployment

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'How long to run the testnet (minutes)'
        required: true
        default: '10'
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy-testnet:
    name: Deploy 4-node testnet
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.duration) + 30 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: gridway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Rust (for gridway-setup)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-testnet-${{ hashFiles('**/Cargo.lock') }}

      - name: Build gridway-setup
        run: |
          cargo build --release -p gridway-consensus --bin gridway-setup

      - name: Generate 4-node testnet config
        run: |
          ./target/release/gridway-setup \
            --peers 4 \
            --bootstrappers 1 \
            --internal-ports \
            --no-local \
            --host-pattern 'gridway-node-{}' \
            --output testnet

      - name: Start testnet
        run: |
          docker compose -f docker-compose.multi.yml up -d
          echo "Waiting for services to start..."
          sleep 30

      - name: Health check all nodes
        run: |
          ALL_HEALTHY=true
          for i in 0 1 2 3; do
            HTTP_PORT=$((4547 + i * 3))
            echo "Checking node $i on port $HTTP_PORT..."

            HEALTH=$(curl -sf http://localhost:$HTTP_PORT/health 2>/dev/null | jq -r '.status // "unknown"' || echo "ERROR")
            echo "  Node $i health: $HEALTH"

            if [[ "$HEALTH" == "ERROR" ]]; then
              echo "  WARNING: Node $i not responding"
              ALL_HEALTHY=false
            fi
          done

          if [[ "$ALL_HEALTHY" == "false" ]]; then
            echo "Some nodes are not healthy, checking docker logs..."
            docker compose -f docker-compose.multi.yml logs --tail=30
          fi

      - name: Monitor testnet
        run: |
          DURATION_SECONDS=$((${{ github.event.inputs.duration }} * 60))
          END_TIME=$(($(date +%s) + DURATION_SECONDS))

          echo "Monitoring testnet for ${{ github.event.inputs.duration }} minutes..."

          while [ $(date +%s) -lt $END_TIME ]; do
            echo "=== Status at $(date) ==="
            for i in 0 1 2 3; do
              HTTP_PORT=$((4547 + i * 3))
              HEALTH=$(curl -sf http://localhost:$HTTP_PORT/health 2>/dev/null || echo '{"status":"unreachable"}')
              echo "  Node $i: $HEALTH"
            done
            echo ""
            sleep 30
          done

          echo "Testnet ran successfully for ${{ github.event.inputs.duration }} minutes!"

      - name: Export logs
        if: always()
        run: |
          mkdir -p testnet-logs
          docker compose -f docker-compose.multi.yml logs > testnet-logs/all-services.log
          for i in 0 1 2 3; do
            docker compose -f docker-compose.multi.yml logs gridway-node-$i > testnet-logs/node-$i.log 2>&1 || true
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-logs-${{ github.run_id }}
          path: testnet-logs/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.multi.yml down -v
          rm -rf testnet/
