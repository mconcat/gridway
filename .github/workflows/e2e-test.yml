name: End-to-End Tests

on:
  push:
    branches: [ main, develop, experiment/commonware-migration ]
  pull_request:
    branches: [ main ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config jq curl

    - name: Build binaries
      run: |
        cargo build --release -p gridway-consensus \
          --bin gridway-node \
          --bin gridway-setup \
          --bin gridway-keygen

    - name: Verify WASM modules exist
      run: |
        echo "Checking pre-compiled WASM modules..."
        ls -lh modules/bank_component.wasm
        ls -lh modules/hook_component.wasm
        ls -lh modules/validator_component.wasm

    - name: Generate single-node config
      run: |
        ./target/release/gridway-setup \
          --peers 1 \
          --bootstrappers 1 \
          --output e2e-testnet

    - name: Start node
      run: |
        ./target/release/gridway-node \
          --peers=e2e-testnet/peers.yaml \
          --config=e2e-testnet/validator-0/config.yaml \
          --genesis=e2e-testnet/genesis.yaml \
          > node.log 2>&1 &
        NODE_PID=$!
        echo "NODE_PID=$NODE_PID" >> $GITHUB_ENV

        echo "Waiting for node to start..."
        for i in $(seq 1 30); do
          if curl -sf http://localhost:4547/health > /dev/null 2>&1; then
            echo "Node is healthy after ${i}s"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "ERROR: Node failed to start within 30s"
            cat node.log
            exit 1
          fi
          sleep 1
        done

    - name: Check node health
      run: |
        echo "=== Node Health ==="
        curl -sf http://localhost:4547/health | jq .

    - name: Wait for blocks
      run: |
        echo "Waiting for blocks to be produced..."
        sleep 10
        echo "=== Node Status ==="
        curl -sf http://localhost:4547/health | jq .

    - name: Collect logs on failure
      if: failure()
      run: |
        echo "=== Node Logs ==="
        cat node.log || true

    - name: Cleanup
      if: always()
      run: |
        kill $NODE_PID 2>/dev/null || true
        rm -rf e2e-testnet/
