name: Build WASM

on:
  push:
    branches: [ main, develop, experiment/commonware-migration ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm-verify:
    name: Verify WASM Modules
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Verify pre-compiled WASM modules exist
      run: |
        echo "Checking pre-compiled WASM modules in modules/..."
        MISSING=0
        for module in bank_component.wasm hook_component.wasm validator_component.wasm; do
          if [ -f "modules/$module" ]; then
            SIZE=$(stat -c%s "modules/$module")
            echo "  ✓ $module ($SIZE bytes)"
          else
            echo "  ✗ MISSING: $module"
            MISSING=1
          fi
        done

        if [ $MISSING -eq 1 ]; then
          echo "ERROR: Missing pre-compiled WASM modules!"
          exit 1
        fi

        echo ""
        echo "All WASM modules present:"
        ls -lh modules/*.wasm

    - name: Upload WASM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wasm-modules
        path: modules/*.wasm
        retention-days: 7
